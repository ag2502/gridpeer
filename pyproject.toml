[project]
name = "gridpeer"
version = "0.1.0"
description = "AI-driven peer-to-peer energy trading marketplace simulation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "prophet>=1.1",
    "pettingzoo>=1.24",
    "stable-baselines3>=2.3",
    "gymnasium>=0.29",
    "streamlit>=1.33",
    "duckdb>=0.10",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "shared", "simulation", "agents", "forecasting", "dashboard"]
