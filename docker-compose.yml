services:
  dev:
    build: .
    volumes:
      - .:/app
    ports:
      - "8501:8501"   # Streamlit
    stdin_open: true
    tty: true
    command: bash

# Usage:
#   docker compose run --rm dev            # drop into a shell with everything installed
#   docker compose run --rm dev pytest     # run tests inside the container
#   docker compose run --rm dev streamlit run dashboard/app.py
#
# This exists so all four of you are running the exact same dependency
# versions, instead of debugging "works on my machine" issues on day 10.
